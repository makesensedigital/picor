# The delivery gate — Handbook §26.
#
# Adapted from templates/landing/.github/workflows/gate.yml at handbook v3.7.1. Every deviation from
# that template is named below with its reason. §20 and §26 both forbid dropping a stage silently;
# a stage that does not run here says so and says why.
#
# §20's five stages are declared INAPPLICABLE for this class, by name and with the reason — there is
# no build, no type system, no unit suite and no dependency tree here. This replaces them.
#
# WHY EVERY CHECK RUNS EVEN AFTER ONE FAILS
#
# A report that stops at the first line is a worse input than one that lists everything wrong at
# once. A lint's output is input to the next turn (§20). So every step is `if: '!cancelled()'`, and
# `gate` is the single thing to require in branch protection.
#
# ---------------------------------------------------------------------------------------------
# DEVIATIONS FROM THE TEMPLATE — all four, with reasons
#
# (Deviation 2 was "no publish job" until 2026-08-11. It is now a sequencing note, not an absence.)
#
# 1. NO `build-derived.mjs --check` STEP. `facts.js` and the derivation were not adopted: this site
#    holds its business facts in three independent places (markup, JSON-LD, llms.txt) and migrating
#    to a single source rewrites `index.html`. Recorded as DEBT-04, not dropped.
#
# 2. THE PUBLISH JOB TARGETS THE github.io ADDRESS, NOT `picor.com.ar` — yet. OPEN-03 was decided
#    on 2026-08-11 (Juan Torresel): the publication origin moves from a manual upload to this
#    workflow. Pages is enabled and the repository was made public to allow it on the free plan.
#    What remains is the domain: verification at organization level and the DNS move, both of which
#    are irreversible and belong to a human under §22. Full sequence in the `publish` job below.
#
#    NOTE WHAT THIS COSTS, recorded in OPEN-03 before it was paid: GitHub Pages serves NO custom
#    response headers and issues NO real redirects. No content security policy, no framing control,
#    and DEBT-09 (`www` vs apex) becomes unfixable there. The site has none of those today, so
#    nothing in use is lost — but the option is gone, and a reader in a year should find that here.
#
# 3. LIGHTHOUSE RUNS BUT DOES NOT BLOCK (`continue-on-error`). Its floors cannot be met while three
#    PNGs weigh 25 MB between them; a step that is red from the first day is a step somebody turns
#    off in a week, which is the failure this whole procedure exists to avoid. It runs so the number
#    is visible and moves. Recorded as DEBT-05 WITH THE TRIGGER that makes it blocking: the day the
#    image debt is paid. This is the only non-blocking step here and it is not a suppression — the
#    check runs, the output is read, and nothing is silenced.
#
# 4. ~~NO `lighthouserc.json`.~~ **Resolved 2026-08-12**, together with deviation 3. One floor is a
#    warning rather than an error - largest-contentful-paint - and the file says why in place: at
#    6.8s it fails any honest floor today, and the largest remaining cause is the render-blocking
#    third-party font stylesheet, which is DEBT-04. Autorun uses its defaults until the floors are set
#    with the same commit that makes step 3 blocking. Part of DEBT-14, whose trigger has now
#    fired - so the step prints its scores, and the floors come from a measurement.
# ---------------------------------------------------------------------------------------------

name: Delivery gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ the site's own rules
  # Seconds, no network, no dependencies. These are the rules no general-purpose tool knows about,
  # which is exactly why §20 says to promote a rule into code when documentation fails to hold it.
  checks:
    name: Site rules (§26)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: The vendored checks are unmodified
        # THE SUBSTITUTE FOR `test-gate.mjs`, WHICH THIS REPOSITORY CANNOT RUN — see INAPPLICABLE-01.
        #
        # The template's self-test builds its fixtures by copying the repository around it and
        # editing the template's placeholder values. In an adopting repository those values are
        # real, the fixture setup throws, and the test never reaches a check. It tests THE CHECKS,
        # and the checks are maintained upstream — so its home is the handbook repository, where it
        # runs against the template on every change.
        #
        # What that leaves is the risk it was covering here: a check edited locally to make a
        # finding go away is a check nobody verified. So the checks are pinned by hash. Editing one
        # in place fails right here, which makes "never edit them locally" enforceable rather than
        # aspirational. Re-take them from a released tag and update the manifest with the same
        # commit that updates .github/handbook-version.md.
        if: ${{ !cancelled() }}
        run: sha256sum -c scripts/.vendored.sha256

      - name: One configuration module, no placeholders
        # NOTE: this site is adopting, so this step is EXPECTED to report findings. The ratchet
        # below is what decides whether the build fails. Read the findings; they are the debt.
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: node scripts/check-config.mjs

      - name: Indexability and the mobile render rules (§26, §6c)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: node scripts/check-markup.mjs

      - name: Byte budgets, orphans and third-party origins
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: node scripts/check-assets.mjs

      - name: Nothing new (ratchet)
        # THIS is the blocking one, and it is the whole mechanism. The three steps above report what
        # this repository already owed on the day it adopted the standard — carried on purpose, in
        # `.gate-baseline.json`, so the gate never reports a compliance this site does not have.
        # This step fails the moment any of those counts RISES.
        #
        # `continue-on-error` above is scoped to exactly that: it lets the findings PRINT without
        # the job going red on the pre-existing ones. It is not a suppression — nothing is disabled,
        # every finding is emitted, and a new one still fails right here.
        if: ${{ !cancelled() }}
        run: node scripts/ratchet.mjs

      - name: No tracked secret or internal material (§4c)
        # The repository is the web root: a committed file is a published file. This is the last
        # line, not the mechanism — `.gitignore` is where the decision lives. Blocking from day one,
        # deliberately: this one has never been about carrying what already exists.
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          if git ls-files | grep -Ei '\.(ai|psd|sketch|fig|env|pem|key|p12|pfx)$|(^|/)(Branding|drafts|client)/'; then
            echo "::error::Internal material is tracked, and in this architecture tracked means published (Handbook §26)."
            exit 1
          fi
          echo "OK — nothing internal is tracked."

  # ------------------------------------------------------------------ external tools, pinned
  # Minutes, and independent of the job above so a finding in `config.js` never hides a regression
  # here. Both tools are pinned by exact version and fetched with `npx --yes`; bumping one is a
  # change with a proposal, not a convenience edit — §22 treats CI configuration as privileged.
  external:
    name: Links and performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Serve the site
        run: |
          python3 -m http.server 8080 --directory . &
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/ >/dev/null && break
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:8080/ >/dev/null

      - name: Links resolve
        # Blocking. An internal link that 404s is a defect that was always a defect, and in this
        # architecture it raises nothing at all on the live site.
        if: ${{ !cancelled() }}
        run: |
          npx --yes linkinator@6.1.2 http://127.0.0.1:8080/ \
            --recurse \
            --skip '^https?://(?!127\.0\.0\.1)' \
            --verbosity error

      - name: Mobile performance and accessibility thresholds
        # BLOCKING as of 2026-08-12. DEBT-14 is paid.
        #
        # The floors live in lighthouserc.json, set from the median of three measured CI runs
        # rather than guessed, each with the reason it sits where it does. A loosened floor shows
        # up in a diff and has to be argued for, which is the whole point of putting them in a
        # file instead of a flag.
        #
        # It still prints the scores. A gate that only says pass or fail teaches nothing about
        # which direction the number is moving.
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          npx --yes @lhci/cli@0.14.0 autorun
          node -e '
            const fs = require("fs");
            const dir = ".lighthouseci";
            if (!fs.existsSync(dir)) { console.log("no lighthouse output"); process.exit(0); }
            const runs = fs.readdirSync(dir).filter(f => f.startsWith("lhr-") && f.endsWith(".json"));
            if (!runs.length) { console.log("no lighthouse report found"); process.exit(0); }
            const all = runs.map(f => JSON.parse(fs.readFileSync(dir + "/" + f, "utf8")))
              .sort((a, b) => a.categories.performance.score - b.categories.performance.score);
            const r = all[Math.floor(all.length / 2)];
            console.log("");
            console.log("=== Lighthouse mobile, median of " + runs.length + " runs ===");
            for (const c of Object.values(r.categories)) {
              console.log("  " + c.title.padEnd(20) + Math.round(c.score * 100));
            }
            console.log("");
            for (const k of ["largest-contentful-paint", "cumulative-layout-shift", "total-blocking-time", "speed-index"]) {
              const a = r.audits[k];
              if (a) console.log("  " + k.padEnd(28) + a.displayValue);
            }
            console.log("");
            console.log("  Floors are in lighthouserc.json, with the reason for each.");
            console.log("");
          '

      - name: Keep the Lighthouse report
        # So the numbers outlive the log and can be compared run to run.
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 30

  # ------------------------------------------------------------------ the single required check
  gate:
    name: Delivery gate
    needs: [checks, external]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every check passed
        run: |
          set -euo pipefail
          echo "site rules : ${{ needs.checks.result }}"
          echo "external   : ${{ needs.external.result }}"
          if [ "${{ needs.checks.result }}" != "success" ] || [ "${{ needs.external.result }}" != "success" ]; then
            echo "::error::The gate did not pass. Every failing check is listed in the two jobs above — fix them together rather than one per run."
            exit 1
          fi
          echo "Gate passed — meaning NOTHING NEW was added. It does not mean this site complies; see docs/adoption-baseline.md."

  # ------------------------------------------------------------------ publication
  # OPEN-03, resolved 2026-08-11: the publication origin moves from a manual upload to this
  # workflow. §26's core requirement for this class — the pipeline publishes, not a branch, and it
  # publishes only when the gate passes — is met from here.
  #
  # WHAT THIS DOES NOT DO YET, AND WHY THAT IS THE RIGHT ORDER.
  #
  # There is no CNAME file, so this publishes to https://makesensedigital.github.io/picor/ and NOT
  # to picor.com.ar, which still resolves to the old Apache host. That is deliberate: the custom
  # domain must be verified at the organization level and DNS moved by a human (§22 — irreversible,
  # and the loss on a mistake is the client's domain). Committing CNAME first would point Pages at a
  # domain that does not resolve here and make the copy below unreachable — so there would be
  # nothing to verify before the switch.
  #
  # EXPECT ROOT-ABSOLUTE PATHS TO 404 ON THAT URL. A project page is served under `/picor/`, and the
  # site references `/favicon.ico`, `/site.webmanifest` and `/privacy.html` from the root. Those
  # resolve correctly the moment the custom domain is bound, because then the site IS at the root.
  # It is an artefact of verifying on a subpath, not a defect to chase.
  #
  # THE REMAINING STEPS, ALL HUMAN:
  #   1. Verify the copy above renders.
  #   2. Verify domain ownership at the organization level — this is what stops another account
  #      claiming picor.com.ar.
  #   3. Move DNS. Confirm the `www` variant is handled (DEBT-09) — after this it cannot be fixed,
  #      because GitHub Pages issues no real redirects.
  #   4. Commit CNAME. Then this job binds the domain and the manual upload stops for good.
  publish:
    name: Publish
    needs: gate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The domain file must travel with the artifact. Moving the publication origin and omitting it
      # unbinds the custom domain SILENTLY — the site keeps working on the github.io address and the
      # client's domain stops resolving (§26). A warning today, because the domain is not bound yet;
      # once step 4 above is done this is the check that keeps it bound.
      - name: The domain file travels with the artifact
        run: |
          set -euo pipefail
          if [ -f CNAME ]; then
            echo "OK — CNAME travels with the artifact: $(cat CNAME)"
          else
            echo "::warning::No CNAME. Publishing to the github.io address only — picor.com.ar is still served by the old host. This is expected until the DNS move; see OPEN-03."
          fi

      - uses: actions/configure-pages@v5

      # The whole repository, which is what the manual upload already published — so this is not a
      # regression, and narrowing it is DEBT-10 rather than something to slip in here. Note what
      # that means today: docs/, brief.md and GTM_SETUP.md are served at their URLs.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
